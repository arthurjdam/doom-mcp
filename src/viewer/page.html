<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOOM // spectator</title>
<style>
  @font-face { font-family: "Press Start 2P"; src: url(/fonts/PressStart2P.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "VT323"; src: url(/fonts/VT323.ttf) format("truetype"); font-display: block; }
  :root {
    --bg: #05080b;
    --panel: #09111a;
    --border: #1c4a5a;
    --border-hi: #2fd6e6;
    --text: #b8f2e6;
    --muted: #5f8a93;
    --accent: #ff3b5c;
    --comment: #ffb000;
    --ok: #39ff88;
    --route: #ffb000;
    --pixel: "Press Start 2P", "VT323", monospace;
    --mono: "VT323", "Press Start 2P", monospace;
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 19px/1.15 var(--mono); -webkit-font-smoothing: none; font-smooth: never; }
  /* CRT scanlines over everything */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px); }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px;
    height: 100%; padding: 14px; }
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 10px;
    border-bottom: 2px solid var(--border); }
  h1 { margin: 0; font: 12px/1 var(--pixel); letter-spacing: .04em; text-transform: uppercase;
    color: var(--text); }
  h1 span { color: var(--accent); }
  h1::before { content: "> "; color: var(--border-hi); }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px;
    color: var(--muted); font: 9px/1 var(--pixel); text-transform: uppercase; }
  .dot { width: 8px; height: 8px; background: var(--muted); }
  .dot.live { background: var(--ok); box-shadow: 0 0 6px var(--ok); animation: blink 1.4s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .screen-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #screen { display: block; width: 100%; max-height: 100%; aspect-ratio: 4 / 3; object-fit: fill;
    image-rendering: pixelated; background: #000; border: 2px solid var(--border-hi);
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--border); }
  .now { margin-top: 14px; min-height: 3.2em; padding: 8px 12px; background: var(--panel);
    border: 2px solid var(--border); border-left: 6px solid var(--comment); color: var(--comment);
    font-size: 21px; }
  .now:empty::before { content: "AWAITING INPUT_"; color: var(--muted); }

  aside { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel);
    border: 2px solid var(--border); }
  .panel h2 { display: flex; align-items: center; gap: 8px; margin: 0; padding: 9px 10px;
    font: 9px/1 var(--pixel); letter-spacing: .04em; text-transform: uppercase;
    color: var(--border-hi); background: rgba(47,214,230,.07); border-bottom: 2px solid var(--border); }
  .panel h2::before { content: "["; color: var(--muted); }
  .panel h2::after { content: "]"; color: var(--muted); order: 1; }
  .panel h2 #level-name { color: var(--muted); }
  .panel h2 .extra { margin-left: auto; order: 2; }
  button { font: 8px/1 var(--pixel); text-transform: uppercase; color: var(--border-hi);
    background: transparent; border: 2px solid var(--border); padding: 5px 7px; cursor: pointer; }
  button:hover { color: var(--bg); background: var(--border-hi); border-color: var(--border-hi); }

  #map { display: block; width: 100%; height: 240px; background: #03060a;
    background-image: linear-gradient(rgba(47,214,230,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47,214,230,.06) 1px, transparent 1px);
    background-size: 20px 20px; }
  .goal { padding: 6px 10px; color: var(--muted); border-top: 2px solid var(--border); }
  .goal b { color: var(--route); font-weight: 400; text-transform: uppercase; }
  .goal:empty { display: none; }

  #plan { margin: 0; padding: 8px 10px; max-height: 170px; overflow-y: auto; white-space: pre-wrap;
    font: 19px/1.15 var(--mono); }
  #plan:empty::before { content: "NO PLAN LOADED"; color: var(--muted); }

  .log-panel { flex: 1; }
  #log { flex: 1; overflow-y: auto; padding: 8px 10px; margin: 0; list-style: none; min-height: 120px; }
  #log li { padding: 3px 0; white-space: pre-wrap; word-break: break-word; }
  #log li.action { color: var(--text); border-top: 1px dashed var(--border); padding-top: 7px; margin-top: 4px; }
  #log li.action::before { content: "> "; color: var(--accent); }
  #log li.comment { color: var(--comment); }
  #log li.comment::before { content: "// "; }
  #log li.result { color: var(--muted); }
  #log li.result::before { content: "  = "; }
  #log li.event { color: var(--muted); }
  #log li.event::before { content: "- "; }
  #log li.alert { color: var(--accent); }
  #log li.alert::before { content: "! "; }

  /* thin square scrollbars */
  * { scrollbar-width: thin; scrollbar-color: var(--border) var(--bg); }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; height: auto; }
    #screen { max-height: none; }
    .log-panel { height: 360px; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <header>
      <h1><span>DOOM</span>.EXE // CLAUDE PLAYING</h1>
      <div class="status"><div class="dot" id="dot"></div><span id="conn">connecting</span></div>
    </header>
    <div class="screen-wrap"><canvas id="screen" width="320" height="200"></canvas></div>
    <div class="now" id="now"></div>
  </section>
  <aside>
    <div class="panel">
      <h2>Map<span id="level-name"></span><span class="extra"><button id="zoom">Whole level</button></span></h2>
      <canvas id="map"></canvas>
      <div class="goal" id="goal"></div>
    </div>
    <div class="panel">
      <h2>Plan</h2>
      <pre id="plan"></pre>
    </div>
    <div class="panel log-panel">
      <h2>Log</h2>
      <ul id="log"></ul>
    </div>
  </aside>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const ctx = $("screen").getContext("2d");
  const log = $("log"), now = $("now");

  // ---- Game video ----
  let pending = false, next = null;
  function draw(src) {
    // Drop frames rather than queue them if decoding falls behind.
    if (pending) { next = src; return; }
    pending = true;
    const img = new Image();
    img.onload = img.onerror = () => {
      if (img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0);
      pending = false;
      if (next) { const n = next; next = null; draw(n); }
    };
    img.src = src;
  }

  // ---- Log ----
  function addLog(entry) {
    const li = document.createElement("li");
    li.className = entry.kind;
    li.textContent = entry.text;
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    log.appendChild(li);
    while (log.children.length > 300) log.firstChild.remove();
    if (atBottom) log.scrollTop = log.scrollHeight;
    if (entry.kind === "comment" && entry.text !== "Updated the plan") now.textContent = entry.text;
  }

  // ---- Minimap ----
  const map = $("map"), mctx = map.getContext("2d");
  const LINE_STYLE = {
    "#": ["#3fa3b3", 1], "%": ["#2a6f7a", 1], "-": ["#173842", 1], ".": ["#173842", 1],
    "D": ["#ffb000", 2], "K": ["#5c8bff", 2.5], "L": ["#c46bff", 2], "S": ["#39ff88", 2.5], "E": ["#ff3b5c", 3.5],
  };
  let level = null, route = [], player = null, wholeLevel = false;

  function fit() {
    const r = map.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    map.width = Math.round(r.width * dpr);
    map.height = Math.round(r.height * dpr);
    redraw();
  }

  function view() {
    const w = map.width, h = map.height;
    if (wholeLevel || !player) {
      const b = level.bounds, pad = 12 * (window.devicePixelRatio || 1);
      const s = Math.min((w - 2 * pad) / (b[2] - b[0]), (h - 2 * pad) / (b[3] - b[1]));
      return { s, cx: (b[0] + b[2]) / 2, cy: (b[1] + b[3]) / 2 };
    }
    // Follow the player, about 2400 map units across.
    return { s: w / 2400, cx: player[0], cy: player[1] };
  }

  let queued = false;
  function redraw() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; paint(); });
  }

  function paint() {
    const w = map.width, h = map.height;
    mctx.clearRect(0, 0, w, h);
    if (!level) return;
    const v = view();
    const X = (x) => w / 2 + (x - v.cx) * v.s, Y = (y) => h / 2 - (y - v.cy) * v.s;
    const dpr = window.devicePixelRatio || 1;
    // Faint lines first, important ones on top.
    for (const pass of [["-", "."], ["#", "%"], ["D", "K", "L", "S", "E"]]) {
      for (const [x1, y1, x2, y2, k] of level.lines) {
        if (!pass.includes(k)) continue;
        const [color, width] = LINE_STYLE[k] || LINE_STYLE["#"];
        mctx.strokeStyle = color;
        mctx.lineWidth = width * dpr;
        mctx.beginPath();
        mctx.moveTo(X(x1), Y(y1));
        mctx.lineTo(X(x2), Y(y2));
        mctx.stroke();
      }
    }
    if (player && route.length) {
      mctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--route");
      mctx.lineWidth = 2 * dpr;
      mctx.setLineDash([4 * dpr, 4 * dpr]);
      mctx.beginPath();
      mctx.moveTo(X(player[0]), Y(player[1]));
      for (const [x, y] of route) mctx.lineTo(X(x), Y(y));
      mctx.stroke();
      mctx.setLineDash([]);
      const [gx, gy] = route[route.length - 1];
      mctx.fillStyle = "#ffb000";
      mctx.fillRect(X(gx) - 4.5 * dpr, Y(gy) - 4.5 * dpr, 9 * dpr, 9 * dpr);
    }
    if (player) {
      const [px, py, a] = player;
      const r = (a * Math.PI) / 180, s = 7 * dpr;
      const tip = [X(px) + Math.cos(r) * s * 1.4, Y(py) - Math.sin(r) * s * 1.4];
      const l = [X(px) + Math.cos(r + 2.5) * s, Y(py) - Math.sin(r + 2.5) * s];
      const rr = [X(px) + Math.cos(r - 2.5) * s, Y(py) - Math.sin(r - 2.5) * s];
      mctx.fillStyle = "#39ff88";
      mctx.strokeStyle = "#03060a";
      mctx.lineWidth = 1.5 * dpr;
      mctx.beginPath();
      mctx.moveTo(...tip); mctx.lineTo(...l); mctx.lineTo(...rr); mctx.closePath();
      mctx.fill(); mctx.stroke();
    }
  }

  function setLevel(data) {
    const xs = data.lines.flatMap((l) => [l[0], l[2]]), ys = data.lines.flatMap((l) => [l[1], l[3]]);
    level = { lines: data.lines, bounds: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)] };
    $("level-name").textContent = " " + data.name;
    redraw();
  }

  function setStatus(st) {
    const goal = $("goal");
    if (!st.in_level) { route = []; goal.textContent = ""; redraw(); return; }
    route = st.route || [];
    player = st.player;
    goal.replaceChildren();
    if (st.goal) {
      goal.append("TARGET: ");
      const b = document.createElement("b");
      b.textContent = st.goal;
      goal.append(b);
      if (st.route_length != null) goal.append(` · ${st.route_length} units`);
      if (st.note) goal.append(" — " + st.note);
    }
    redraw();
  }

  $("zoom").onclick = () => {
    wholeLevel = !wholeLevel;
    $("zoom").textContent = wholeLevel ? "Follow player" : "Whole level";
    redraw();
  };
  new ResizeObserver(fit).observe(map);

  // ---- Event stream ----
  const es = new EventSource("/events");
  // The server replays recent history on every (re)connect.
  es.onopen = () => { log.replaceChildren(); $("dot").classList.add("live"); $("conn").textContent = "link up"; };
  es.onerror = () => { $("dot").classList.remove("live"); $("conn").textContent = "relinking…"; };
  es.addEventListener("frame", (e) => draw("data:image/png;base64," + e.data));
  es.addEventListener("pos", (e) => { player = JSON.parse(e.data); redraw(); });
  es.addEventListener("log", (e) => addLog(JSON.parse(e.data)));
  es.addEventListener("level", (e) => setLevel(JSON.parse(e.data)));
  es.addEventListener("status", (e) => setStatus(JSON.parse(e.data)));
  es.addEventListener("plan", (e) => { $("plan").textContent = JSON.parse(e.data); });
</script>
</body>
</html>
