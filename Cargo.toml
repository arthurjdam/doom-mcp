[package]
name = "doom-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
libc = "0.2.189"
png = "0.18.1"
rmcp = { version = "3.5", features = ["server", "macros", "schemars"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "fs", "sync", "net", "time", "io-util"] }

[build-dependencies]
cc = "1.5.1"
